<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>OFFMODE 초대</title>
  <meta property="og:title" content="OFFMODE 방에 초대받았어요 🌙" />
  <meta property="og:description" content="혼자 또는 친구와 매일 미션을 인증하는 공간, 오프모드. 초대코드로 참여하세요." />
  <!-- TODO: 대표 이미지 절대 URL로 교체하면 카톡 공유 시 썸네일이 뜹니다 -->
  <meta property="og:image" content="https://offmodechallenge.com/invite/og.png" />
  <style>
    :root { --bg:#fbf3e7; --surface:#fff9f0; --text:#4a3b30; --sub:#a8958a; --green:#2e7d52; --border:#e6d8c6; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
      display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--border);
      border-radius:24px; padding:32px 24px; text-align:center; box-shadow:0 8px 30px rgba(74,59,48,0.08); }
    .logo { font-size:30px; font-weight:800; letter-spacing:-0.5px; color:var(--green); font-style:italic; margin:0 0 6px; }
    .tagline { font-size:14px; color:var(--sub); margin:0 0 24px; }
    .label { font-size:12px; color:var(--sub); letter-spacing:1px; margin:0 0 8px; }
    .code { font-size:28px; font-weight:700; letter-spacing:4px; color:var(--text);
      background:var(--bg); border:1px solid var(--border); border-radius:14px; padding:16px; margin:0 0 24px; }
    .btn { display:block; width:100%; padding:16px; border-radius:16px; border:none; font-size:16px; font-weight:600;
      text-decoration:none; cursor:pointer; margin-bottom:12px; }
    .btn-primary { background:#22c97a; color:#fff9f3; }
    .btn-outline { background:transparent; color:var(--green); border:1.5px solid rgba(46,125,82,0.4); }
    .hint { font-size:12px; color:var(--sub); margin-top:16px; line-height:1.6; }
  </style>
</head>
<body>
  <div class="card">
    <p class="logo">OFFMODE</p>
    <p class="tagline">스크린 OFF. 일상 ON.</p>
    <p class="label">초대코드</p>
    <div class="code" id="code">------</div>
    <a class="btn btn-primary" id="openApp" href="#">앱에서 참여하기</a>
    <a class="btn btn-outline" id="appstore" href="https://apps.apple.com/app/id6767263531">App Store에서 받기</a>
    <p class="hint">앱이 설치돼 있으면 위 버튼으로 바로 참여할 수 있어요.<br/>설치 후에는 초대코드를 직접 입력해도 됩니다.</p>
  </div>

  <script>
    // 경로 /invite/{CODE} 에서 코드 추출
    var seg = location.pathname.split('/').filter(Boolean);
    var code = (seg[seg.length - 1] || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code && code !== 'INVITE') {
      document.getElementById('code').textContent = code;
    }
    // "앱에서 참여하기" → 커스텀 스킴으로 앱 열기 시도
    var openApp = document.getElementById('openApp');
    openApp.setAttribute('href', 'offmode://join?code=' + code);
    openApp.addEventListener('click', function () {
      // 스킴 실패 시(미설치) App Store 로 유도. Android 는 아직 미출시.
      var store = document.getElementById('appstore').href;
      setTimeout(function () { window.location.href = store; }, 1200);
    });
  </script>
</body>
</html>
