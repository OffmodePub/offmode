# offmodechallenge.com (루트 도메인) — 초대 링크/딥링크 정적 호스팅
#
# 배치: /etc/nginx/conf.d/offmodechallenge.conf
#       (또는 /etc/nginx/sites-available/ + sites-enabled 심볼릭 링크)
#
# 순서:
#   1) Cloudflare DNS 에 A @ -> 43.202.90.1 (DNS only) 추가 (apex 가 해석돼야 certbot 검증 가능)
#   2) 이 파일을 넣고  sudo nginx -t && sudo systemctl reload nginx
#   3) sudo certbot --nginx -d offmodechallenge.com
#      → certbot 이 443(SSL) server 블록과 http->https 리다이렉트를 자동으로 추가한다.
#   4) web/public/ 을 /var/www/offmode 로 배포 (deploy.sh 참고)

server {
    listen 80;
    listen [::]:80;
    server_name offmodechallenge.com;

    root /var/www/offmode;

    # iOS Universal Link 검증 파일 — 확장자 없음 → JSON 강제, 리다이렉트 금지
    location = /.well-known/apple-app-site-association {
        default_type application/json;
    }

    # (안드로이드 출시 시 사용) App Links 검증 파일
    location = /.well-known/assetlinks.json {
        default_type application/json;
    }

    # 초대 랜딩: /invite/{아무코드} → 단일 HTML (코드는 클라이언트 JS 가 경로에서 파싱)
    location /invite/ {
        try_files $uri /invite/index.html;
    }

    # 그 외 경로는 노출하지 않음 (배포 폴더의 nginx/·스크립트 등 보호)
    location / { return 404; }
}
