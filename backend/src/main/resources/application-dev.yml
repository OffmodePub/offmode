spring:
  datasource:
    url: jdbc:h2:file:./offmode-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/h2

apple:
  # dev 실기기 빌드의 번들 ID는 .dev 접미사가 붙는다 (ios PRODUCT_BUNDLE_IDENTIFIER=com.minnnj.offmode.dev)
  bundle-id: com.minnnj.offmode.dev

offmode:
  security:
    cors:
      allowed-origin-patterns:
        - "*"
