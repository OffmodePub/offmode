spring:
  datasource:
    url: jdbc:h2:file:./offmode-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations:
      - classpath:db/migration/h2

# apple.bundle-id 는 application.yml 의 com.minnnj.offmode 를 그대로 쓴다.
# (dev 빌드도 같은 번들 ID 를 쓰므로 .dev 접미사 오버라이드를 두면 Apple 로그인 aud 검증이 실패한다)

offmode:
  security:
    cors:
      allowed-origin-patterns:
        - "*"
